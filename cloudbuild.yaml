steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/logisense-dashboard', './dashboard']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/logisense-dashboard']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - logisense-dashboard
      - --image=gcr.io/$PROJECT_ID/logisense-dashboard
      - --region=us-central1
      - --allow-unauthenticated
      - --quiet
