steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/logisense-dashboard:$COMMIT_SHA'
      - './dashboard'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/logisense-dashboard:$COMMIT_SHA'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy logisense-dashboard \
          --image=gcr.io/$PROJECT_ID/logisense-dashboard:$COMMIT_SHA \
          --region=us-central1 \
          --allow-unauthenticated \
          --quiet
images:
  - 'gcr.io/$PROJECT_ID/logisense-dashboard:$COMMIT_SHA'
