steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy logisense-dashboard \
          --source ./dashboard \
          --region us-central1 \
          --allow-unauthenticated \
          --project $PROJECT_ID \
          --quiet
